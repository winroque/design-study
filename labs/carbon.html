<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carbon lab · Atlas</title>
<meta name="description" content="IBM’s Carbon 1.120 running for real: four themes, adjustable table density, batch selection and the UI Shell.">
<link rel="stylesheet" href="../vendor/carbon/tokens.css">
<link rel="stylesheet" href="../vendor/carbon/bundle.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--background);color:var(--text-primary)}
  #boot{padding:80px 16px;text-align:center;color:#6f6f6f;font-family:var(--font-sans)}
  .lab{min-height:100vh;background:var(--background);color:var(--text-primary);font-family:var(--font-sans)}
  .lab-main{max-width:1312px;margin:0 auto;padding:5rem max(16px,env(safe-area-inset-right,0px)) 4rem max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2rem}
  .lab-intro{display:flex;flex-direction:column;gap:.75rem;max-width:44rem}
  .lab-eyebrow{font-size:.75rem;letter-spacing:.32px;color:var(--text-secondary)}
  .lab-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1px;background:var(--border-subtle-01)}
  .lab-controls>div{background:var(--layer-01);padding:1rem;display:flex;flex-direction:column;gap:.75rem;min-width:0}
  .lab-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:1px;background:var(--border-subtle-01);margin-bottom:2rem}
  .lab-kpis .cds--tile{display:flex;flex-direction:column;gap:.5rem;min-height:8.5rem}
  .lab-kpi-n{font-size:2.625rem;font-weight:300;line-height:1.2}
  .lab-scroll{overflow-x:auto}
  .lab-form{display:flex;flex-direction:column;gap:1.5rem;max-width:40rem}
  .lab-row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1.5rem}
  .lab-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr));gap:1px;background:var(--border-subtle-01)}
  .lab-gallery>section{background:var(--layer-01);padding:1rem;display:flex;flex-direction:column;gap:1rem;min-width:0}
  .lab-flex{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
  .lab-themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  .lab-themes>div{padding:1rem .75rem;display:flex;flex-direction:column;align-items:flex-start;gap:.75rem;overflow:hidden;background:var(--background);color:var(--text-primary);min-width:0}
  .lab-toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:9000}
  .lab-tabpanel{padding-top:1.5rem}
  .lab-foot{font-size:.75rem;color:var(--text-helper)}
  @media (max-width:42rem){.lab-themes{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="root"><p id="boot">Loading Carbon…</p></div>
<script src="../vendor/carbon/react.production.min.js"></script>
<script src="../vendor/carbon/react-dom.production.min.js"></script>
<script src="../vendor/carbon/bundle.js"></script>
<script src="carbon-lab.js"></script>
</body>
</html>
